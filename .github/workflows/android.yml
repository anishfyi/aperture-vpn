name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch ics-openvpn for embedded library
        run: git -C vendor/ics-openvpn apply ../../patches/ics-openvpn-embedded.patch

      - name: Drop vendored Gradle wrapper jar (snapshot build, unvalidatable, never executed)
        run: rm -f vendor/ics-openvpn/gradle/wrapper/gradle-wrapper.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;35.0.0" "ndk;30.0.14904198"
          sudo apt-get update
          sudo apt-get install -y swig

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Assemble debug APK
        run: gradle :app:assembleSkeletonOvpn23Debug --stacktrace
